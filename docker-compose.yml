services:
  nginx:
    image: nginx:1.27-alpine
    container_name: linkforge_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - linkforge

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: linkforge_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      PHP_IDE_CONFIG: "serverName=linkforge"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - linkforge

  mysql:
    image: mysql:8.0
    container_name: linkforge_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: linkforge
      MYSQL_USER: linkforge
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - linkforge

  redis:
    image: redis:7-alpine
    container_name: linkforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - linkforge

  mailhog:
    image: mailhog/mailhog:latest
    container_name: linkforge_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - linkforge

networks:
  linkforge:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
